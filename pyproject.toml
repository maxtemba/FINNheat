[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finnheat"
version = "0.1.0"
description = "Hardware-aware NAS pipeline for quantized grasping models on Xilinx KV260"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["config", "nas_search"]
packages = ["core"]
